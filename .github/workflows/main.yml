on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: "Dummy extension: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}, ${{ matrix.db }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current LTS. PHP is the minimum that branch requires.
          - mw: REL1_43
            php: "8.1"
            db: sqlite
            use_mysql: false
          - mw: REL1_43
            php: "8.1"
            db: mysql
            use_mysql: true
          # Development branch. Its composer.json requires PHP 8.3.
          - mw: master
            php: "8.3"
            db: sqlite
            use_mysql: false
          - mw: master
            php: "8.3"
            db: mysql
            use_mysql: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test dummy extension
        uses: ./
        with:
          php: ${{ matrix.php }}
          mwbranch: ${{ matrix.mw }}
          extension: DummyExtension
          use_mysql: ${{ matrix.use_mysql }}
